name: LexGuardBE CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        
    - name: Lint with Black
      run: black --check app tests
      
    - name: Sort imports with isort
      run: isort --check-only app tests
      
    - name: Lint with flake8
      run: flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
      
    - name: Test with pytest
      run: |
        pytest tests/ --doctest-modules --junitxml=junit/test-results.xml
      env:
        # Mocking necessary environment variables for tests
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'mock-key' }}
        QDRANT_HOST: 'localhost'
        QDRANT_PORT: 6333
        PYTHONPATH: .

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Load
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: lexguard-be:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Example: Push to Registry (Commented out until secrets are configured)
